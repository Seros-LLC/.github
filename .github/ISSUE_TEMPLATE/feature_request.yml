name: Feature request
description: Suggest a change or an addition.
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and where does it break down today? Describe the problem, not the solution.
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes:
      label: What you would like to happen
    validations: {required: true}
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have tried
  - type: dropdown
    id: importance
    attributes:
      label: How much does this matter to you?
      options:
        - I cannot use Seros without it
        - It costs me real time today
        - It would be nice
    validations: {required: true}
